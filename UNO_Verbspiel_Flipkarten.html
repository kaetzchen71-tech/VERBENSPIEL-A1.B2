<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>UNO Verbspiel — Flipkarten</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --a1-bg:#e9f3e6; --a1-dark:#3f8a3f; --a1-deep:#2f6b2f;

    --b1-bg:#fbf3de; --b1-dark:#d9a520; --b1-deep:#b3860f;
    --b2-bg:#fbe9e6; --b2-dark:#c8352c; --b2-deep:#9c241d;
    --ink:#1a1a1a;
    --paper:#f4f1ea;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Verdana, sans-serif;
    background:linear-gradient(180deg,#20242b,#12151a);
    color:#eee;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 12px 60px;
  }
  h1{
    font-size:1.6rem;
    margin:6px 0 2px;
    letter-spacing:.02em;
  }
  .subtitle{
    color:#9aa0aa;
    font-size:.95rem;
    margin-bottom:18px;
    text-align:center;
  }
  .panel{
    background:#1c1f26;
    border:1px solid #333844;
    border-radius:14px;
    padding:16px 20px;
    width:100%;
    max-width:520px;
    margin-bottom:18px;
  }
  .levels{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:12px;
  }
  .lvl-btn{
    border:2px solid transparent;
    border-radius:20px;
    padding:6px 14px;
    font-weight:700;
    font-size:.85rem;
    cursor:pointer;
    color:#111;
    opacity:.45;
    transition:opacity .15s, transform .1s;
  }
  .lvl-btn.active{ opacity:1; }
  .lvl-btn:active{ transform:scale(.95); }
  .lvl-A1{background:var(--a1-bg); border-color:var(--a1-dark);}
  .lvl-A2{background:var(--a2-bg); border-color:var(--a2-dark);}
  .lvl-B1{background:var(--b1-bg); border-color:var(--b1-dark);}
  .lvl-B2{background:var(--b2-bg); border-color:var(--b2-dark);}

  .row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .stat{
    text-align:center;
    flex:1;
    min-width:80px;
  }
  .stat .num{ font-size:1.4rem; font-weight:800; display:block; }
  .stat .label{ font-size:.72rem; color:#9aa0aa; text-transform:uppercase; letter-spacing:.05em; }
  #pointsNum{ color:#7cd992; }
  #wrongNum{ color:#e07a72; }
  #progressNum{ color:#8ab6ee; }

  .scene{
    width:300px;
    max-width:88vw;
    height:420px;
    perspective:1400px;
    margin-bottom:22px;
  }
  .card{
    position:relative;
    width:100%;
    height:100%;
    transition:transform .55s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
    cursor:pointer;
  }
  .card.flipped{ transform:rotateY(180deg); }
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:22px;
    border:6px solid #14161a;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .front{
    background:var(--lvl-bg,#eee);
  }
  .back{
    transform:rotateY(180deg);
    background:var(--lvl-bg,#eee);
  }
  .badge{
    align-self:flex-start;
    margin:14px;
    background:#111;
    color:#fff;
    font-size:.72rem;
    font-weight:700;
    padding:3px 10px;
    border-radius:8px;
    letter-spacing:.03em;
  }
  .front .infinitive{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 18px;
  }
  .front .infinitive span{
    font-size:2.3rem;
    font-weight:800;
    color:var(--lvl-deep,#222);
  }
  .front .hint{
    text-align:center;
    color:#555;
    font-size:.85rem;
    padding-bottom:16px;
  }
  .back-inner{
    padding:14px 16px 10px;
    display:flex;
    flex-direction:column;
    height:100%;
  }
  .back .infinitive-sm{
    font-size:1.35rem;
    font-weight:800;
    color:var(--lvl-deep,#222);
  }
  .back .translation{
    font-style:italic;
    color:#444;
    font-size:.9rem;
    margin-bottom:8px;
  }
  .formbox{
    background:#fff;
    border:2px solid var(--lvl-dark,#999);
    border-radius:10px;
    padding:6px 10px;
    margin-bottom:6px;
  }
  .formbox .flabel{
    color:var(--lvl-deep,#333);
    font-weight:700;
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .formbox .fval{
    font-size:.98rem;
    color:#111;
  }

  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    width:100%;
    max-width:520px;
  }
  button.action{
    border:none;
    border-radius:10px;
    padding:11px 18px;
    font-size:.95rem;
    font-weight:700;
    cursor:pointer;
    transition:transform .1s, filter .15s;
  }
  button.action:active{ transform:scale(.96); }
  #flipBtn{ background:#3a4150; color:#fff; }
  #correctBtn{ background:#3f8a3f; color:#fff; display:none; }
  #wrongBtn{ background:#c8352c; color:#fff; display:none; }
  #resetBtn{ background:#555c68; color:#ccc; font-size:.8rem; padding:8px 14px; }
  button.action:hover{ filter:brightness(1.1); }
  button:disabled{ opacity:.35; cursor:not-allowed; }

  footer{
    margin-top:20px;
    color:#666;
    font-size:.75rem;
    text-align:center;
  }
</style>
</head>
<body>

<h1>UNO Verbspiel — Flipkarten</h1>
<div class="subtitle">Karte antippen, Formen raten, umdrehen &amp; Punkte sammeln</div>

<div class="panel">
  <div class="levels">
    <div class="lvl-btn lvl-A1 active" data-lvl="A1">A1</div>
    <div class="lvl-btn lvl-A2 active" data-lvl="A2">A2</div>
    <div class="lvl-btn lvl-B1 active" data-lvl="B1">B1</div>
    <div class="lvl-btn lvl-B2 active" data-lvl="B2">B2</div>
  </div>
  <div class="row">
    <div class="stat"><span class="num" id="pointsNum">0</span><span class="label">Richtig</span></div>
    <div class="stat"><span class="num" id="wrongNum">0</span><span class="label">Falsch</span></div>
    <div class="stat"><span class="num" id="progressNum">0/0</span><span class="label">Karten</span></div>
  </div>
</div>

<div class="scene">
  <div class="card" id="card">
    <div class="face front">
      <div class="badge" id="badgeFront">A1</div>
      <div class="infinitive"><span id="infFront">—</span></div>
      <div class="hint">Präsens · Präteritum · Partizip Perfekt sagen, dann umdrehen</div>
    </div>
    <div class="face back">
      <div class="back-inner">
        <div class="badge" id="badgeBack">A1</div>
        <div class="infinitive-sm" id="infBack">—</div>
        <div class="translation" id="tradBack">—</div>
        <div class="formbox"><div class="flabel">Präsens</div><div class="fval" id="presBack">—</div></div>
        <div class="formbox"><div class="flabel">Präteritum</div><div class="fval" id="pretBack">—</div></div>
        <div class="formbox"><div class="flabel">Partizip Perfekt</div><div class="fval" id="ppBack">—</div></div>
      </div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="action" id="flipBtn">Karte umdrehen</button>
  <button class="action" id="correctBtn">✓ Richtig — nächste Karte</button>
  <button class="action" id="wrongBtn">✗ Falsch — nächste Karte</button>
</div>
<div class="controls" style="margin-top:8px;">
  <button class="action" id="resetBtn">Spiel neu starten (mischen)</button>
</div>

<footer>130 Verben · A1–B2 · basierend auf deinem UNO-Verbspiel</footer>

{l:"B2",i:"schreiten",t:"dar pasos / caminar",p:"er schreitet",pt:"er schritt",pp:"er ist geschritten"},
{l:"B2",i:"schmelzen",t:"derretirse / estar derretido",p:"er schmilzt",pt:"er schmolz",pp:"er hat/ist geschmolzen"},
{l:"B2",i:"spinnen",t:"hilar / decir tonterías",p:"er spinnt",pt:"er spann",pp:"er hat gesponnen"},
{l:"B2",i:"schwinden",t:"disminuir / decrecer",p:"er schwindet",pt:"er schwand",pp:"er ist geschwunden"},
{l:"B2",i:"schwellen",t:"inflamarse",p:"er schwillt",pt:"er schwoll",pp:"er ist geschwollen"},
{l:"B2",i:"streichen",t:"pintar / andar dando vueltas",p:"er streicht",pt:"er strich",pp:"er hat/ist gestrichen"},
{l:"B2",i:"stoßen",t:"empujar / chocar",p:"er stößt",pt:"er stieß",pp:"er hat/ist gestoßen"},
{l:"B2",i:"stechen",t:"punzar / picar (insectos)",p:"er sticht",pt:"er stach",pp:"er hat gestochen"},
{l:"B2",i:"verderben",t:"podrirse",p:"er verdirbt",pt:"er verdarb",pp:"er hat/ist verdorben"}
];

const lvlBg   = {A1:"#e9f3e6", A2:"#e6eefb", B1:"#fbf3de", B2:"#fbe9e6"};
const lvlDark = {A1:"#3f8a3f", A2:"#2f6fb0", B1:"#d9a520", B2:"#c8352c"};
const lvlDeep = {A1:"#2f6b2f", A2:"#1f527f", B1:"#b3860f", B2:"#9c241d"};

let activeLevels = new Set(["A1","A2","B1","B2"]);
let deck = [];
let idx = 0;
let points = 0;
let wrong = 0;
let currentAnswered = false;

const cardEl = document.getElementById('card');
const infFront = document.getElementById('infFront');
const badgeFront = document.getElementById('badgeFront');
const infBack = document.getElementById('infBack');
const badgeBack = document.getElementById('badgeBack');
const tradBack = document.getElementById('tradBack');
const presBack = document.getElementById('presBack');
const pretBack = document.getElementById('pretBack');
const ppBack = document.getElementById('ppBack');
const flipBtn = document.getElementById('flipBtn');
const correctBtn = document.getElementById('correctBtn');
const wrongBtn = document.getElementById('wrongBtn');
const resetBtn = document.getElementById('resetBtn');
const pointsNum = document.getElementById('pointsNum');
const wrongNum = document.getElementById('wrongNum');
const progressNum = document.getElementById('progressNum');

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function buildDeck(){
  deck = shuffle(VERBS.filter(v => activeLevels.has(v.l)).slice());
  idx = 0;
  points = 0;
  wrong = 0;
  updateStats();
  showCard();
}

function updateStats(){
  pointsNum.textContent = points;
  wrongNum.textContent = wrong;
  progressNum.textContent = (deck.length ? Math.min(idx+1, deck.length) : 0) + "/" + deck.length;
}

function setLevelVars(level){
  cardEl.style.setProperty('--lvl-bg', lvlBg[level]);
  cardEl.style.setProperty('--lvl-dark', lvlDark[level]);
  cardEl.style.setProperty('--lvl-deep', lvlDeep[level]);
}

function showCard(){
  cardEl.classList.remove('flipped');
  currentAnswered = false;
  correctBtn.style.display = 'none';
  wrongBtn.style.display = 'none';
  flipBtn.style.display = 'inline-block';
  flipBtn.disabled = false;

  if(deck.length === 0){
    infFront.textContent = "Keine Karten";
    badgeFront.textContent = "–";
    return;
  }
  if(idx >= deck.length){
    infFront.textContent = "Fertig! 🎉";
    badgeFront.textContent = "Ende";
    flipBtn.disabled = true;
    updateStats();
    return;
  }
  const v = deck[idx];
  setLevelVars(v.l);
  badgeFront.textContent = v.l;
  infFront.textContent = v.i;
  badgeBack.textContent = v.l;
  infBack.textContent = v.i;
  tradBack.textContent = v.t;
  presBack.textContent = v.p;
  pretBack.textContent = v.pt;
  ppBack.textContent = v.pp;
  updateStats();
}

flipBtn.addEventListener('click', () => {
  if(idx >= deck.length) return;
  cardEl.classList.add('flipped');
  flipBtn.style.display = 'none';
  correctBtn.style.display = 'inline-block';
  wrongBtn.style.display = 'inline-block';
});

correctBtn.addEventListener('click', () => {
  if(currentAnswered) return;
  currentAnswered = true;
  points++;
  idx++;
  updateStats();
  setTimeout(showCard, 150);
});

wrongBtn.addEventListener('click', () => {
  if(currentAnswered) return;
  currentAnswered = true;
  wrong++;
  idx++;
  updateStats();
  setTimeout(showCard, 150);
});

resetBtn.addEventListener('click', buildDeck);

document.querySelectorAll('.lvl-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const lvl = btn.dataset.lvl;
    if(activeLevels.has(lvl)){
      if(activeLevels.size > 1){
        activeLevels.delete(lvl);
        btn.classList.remove('active');
      }
    } else {
      activeLevels.add(lvl);
      btn.classList.add('active');
    }
    buildDeck();
  });
});

buildDeck();
</script>
</body>
</html>
